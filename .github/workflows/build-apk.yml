name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (contoh: v1.0.0 atau kosongkan untuk otomatis)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Release Signing Key
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Memos, OU=Mobile, O=Memos, L=Online, S=Global, C=US"

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Locate and Prepare APK
        id: prepare_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" memos-release.apk
          ls -lh memos-release.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memos-release-apk
          path: memos-release.apk
          retention-days: 30

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="apk-v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG_NAME"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          name: "Memos Android APK ${{ steps.get_tag.outputs.tag_name }}"
          body: |
            ### 📱 Memos Android Client (${{ steps.get_tag.outputs.tag_name }})
            
            Aplikasi Android mandiri untuk **Memos** (Self-hosted note-taking service).
            
            #### 📥 Download:
            Download file **`memos-release.apk`** di bawah ini dan pasang di HP Android kamu.
            
            #### ✨ Fitur:
            - Terhubung langsung ke instance/server Memos kamu
            - Dukungan unggah file / foto langsung dari memori HP
            - Tarik ke bawah untuk refresh (Pull-to-refresh)
            - Konfigurasi alamat URL server yang mudah
          draft: false
          prerelease: false
          files: memos-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
