name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (contoh: v1.0.0 atau kosongkan untuk otomatis)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Release Signing Key
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Memos, OU=Mobile, O=Memos, L=Online, S=Global, C=US"

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Locate, Align, and Sign APK
        id: prepare_apk
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: APK not found! Listing outputs:"
            find android/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Found compiled APK at: $RAW_APK"

          # Align APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" aligned.apk || cp "$RAW_APK" aligned.apk

          # Sign APK with full v1, v2, and v3 signature schemes
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out memos-release.apk \
            aligned.apk

          # Verify signature
          echo "=== APK SIGNATURE VERIFICATION ==="
          $BUILD_TOOLS_DIR/apksigner verify --verbose memos-release.apk

          ls -lh memos-release.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memos-release-apk
          path: memos-release.apk
          retention-days: 30

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="apk-v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG_NAME"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "Memos Android APK ${{ steps.get_tag.outputs.tag_name }}"
          body: |
            ### 📱 Memos Android Client (${{ steps.get_tag.outputs.tag_name }})
            
            Aplikasi Android mandiri untuk **Memos** (Self-hosted note-taking service).
            
            #### 📥 Download:
            Download file **`memos-release.apk`** di bawah ini dan pasang di HP Android kamu.
            
            #### ✨ Kompatibilitas:
            - **Arsitektur**: Mendukung universal (ARM64 64-bit, ARM 32-bit, x86, x86_64)
            - **Android Versi**: Android 5.0 (Lollipop) sampai Android 15+
            - **Tanda Tangan**: Lengkap dengan skema APK Signature v1 (JAR), v2, dan v3
          draft: false
          prerelease: false
          files: memos-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
